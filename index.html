  { n:'01', doctor:'ashford', persona:'Dr. Michael Ashford, MD', kind:'long', duration:'3:28', landing:'advertorial', landingUrl:'https://tryrevivehealth.com/pages/advertorial-page-jan-19-11-08-29', headline:'Kegels Miss the Muscle by 2.5 Inches', desc:`Kegels miss the bulbocavernosus by 2.5 inches — a urologist just explained on podcast why every rep you've ever done missed the muscle that actually controls your erections.`, copy:`Kegels stop 3 inches above the muscle responsible for your ED — and a urologist just explained on podcast exactly why months of daily reps produced nothing.\n\nThe most common thing he hears from men who come to him about their ED: "I've been doing kegels. I've been consistent. Nothing has changed."\n\nHis answer is always the same.\n\nOf course nothing changed. Kegels cannot physically reach the muscle responsible for this.\n\nThese are disciplined men. They did their research. They found that pelvic floor training helps with erections — which is true — and they built a daily habit around it. Months of consistent effort. Feeling the contraction working. Assuming it must be helping even when nothing improved.\n\nAnd all the while the muscle that actually controls whether they stay hard has been sitting three inches below every rep they've done — completely untouched, weakening further every month.\n\nThe bulbocavernosus sits three inches deep. A kegel contraction generates force at the surface and dissipates before reaching three inches. Physics, not technique.\n\nRevive delivers targeted vibration pulses engineered to penetrate exactly three inches — directly stimulating the bulbocavernosus. 3,600 contractions per 20-minute session. Fully clothed. On your couch.\n\nWeek 1 — Morning erections return.\nWeek 2 — Sustained firmness. No fading.\nWeek 3 — Partners notice.\nWeek 4 — Most patients reduce or stop their prescription.\n\nRevive is 50% off right now — $59.99 down from $119.99. 90-day money-back guarantee. Full refund. No questions.\       <button class="copy-toggle">Expand copy ↓</button>
      <div class="actions">
        <a class="view-landing" href="${ad.landingUrl}" target="_blank">View landing →</a>
        <a class="download" href="ads/${ad.n}.mp4" download>Download .mp4</a>
      </div>
    </div>
  `;
  grid.appendChild(card);
});

// Wire up video play on thumbnail click
document.querySelectorAll('.media').forEach(m => {
  m.addEventListener('click', () => {
    const v = m.querySelector('video');
    if (m.classList.contains('playing')) {
      v.pause();
      m.classList.remove('playing');
    } else {
      m.classList.add('playing');
      v.play();
    }
  });
});

// Wire up copy expand toggles
document.querySelectorAll('.copy-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const copy = btn.previousElementSibling;
    copy.classList.toggle('expanded');
    btn.textContent = copy.classList.contains('expanded') ? 'Collapse copy ↑' : 'Expand copy ↓';
  });
});

// Wire up filter buttons
document.querySelectorAll('.filter-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const f = b.dataset.f;
    document.querySelectorAll('.card').forEach(c => {
      const show = f === 'all' || c.dataset.doctor === f || c.dataset.kind === f || c.dataset.landing === f;
      c.style.display = show ? '' : 'none';
    });
  });
});
</script>

</body>
</html>
